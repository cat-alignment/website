<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 100" width="44" height="100">
  <!--
    The CAT cat. It sits on a ledge at y = 62 with its back mostly to the viewer
    and its head turned to the left. Everything below y = 62 is tail, which hangs
    over the ledge. The page lines the ledge up with the header rule.

    The shapes are drawn facing right and flipped by the group transform.
  -->
  <style>
    .fur { fill: #0b0b0d; stroke: #0b0b0d; stroke-width: 1; stroke-linejoin: round; }
    .line { fill: none; stroke: #bde3f5; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .whisker { fill: none; stroke: #0b0b0d; stroke-width: 0.8; stroke-linecap: round; }
    .tail { fill: none; stroke: #0b0b0d; stroke-width: 3.4; stroke-linecap: round; }
    .tail-still { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .tail-moving { display: none; }
      .tail-still { display: inline; }
    }
  </style>

